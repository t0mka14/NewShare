kotlin.code.style=official
org.gradle.java.home=/home/tomas/.jdks/temurin-25.0.3



# The shipped app version: §9 `app/version.json`, the window title, jpackage packageVersion and
# every release artifact name all derive from this one value. Strict x.y.z — AppVersion.parse
# (:shared) rejects anything else, and a rejected local version reads as "no local version",
# which would make every remote version look newer. Override per build with -PappVersion=1.0.1.
appVersion=1.0.0

# The version of the *release* — the set of components the server publishes together. Usually
# equal to appVersion; bump it alone for a release that only changes the runtime or the native
# libraries, which leaves app.zip byte-identical so clients do not re-download the app.
releaseVersion=1.0.0

# Baked into <install_dir>/updater.properties by :packaging, where UpdaterConfig reads it.
updateEndpoint=http://192.168.122.183:10001/api/version/latest
