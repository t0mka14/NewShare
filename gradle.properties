# The shipped app version: §9 `app/version.json`, the window title, jpackage packageVersion and
# every release artifact name all derive from this one value. Strict x.y.z — AppVersion.parse
# (:shared) rejects anything else, and a rejected local version reads as "no local version",
# which would make every remote version look newer. Override per build with -PappVersion=1.0.1.
appVersion=1.0.2

# The version of the *release* — the set of components the server publishes together. Usually
# equal to appVersion; bump it alone for a release that only changes the runtime or the native
# libraries, which leaves app.zip byte-identical so clients do not re-download the app.
# Deliberately NOT set here: unset, it follows appVersion (packaging/build.gradle.kts). Pinning it
# in this file silently overrode every -PappVersion=..., so `-PappVersion=1.0.1` built and published
# release 1.0.0. Pass -PreleaseVersion=x.y.z only for a runtime- or natives-only release.

# Base URL of the web backend this build talks to: NO "/api" suffix, no trailing slash. It is baked
# into app.jar (:app generates org/example/app/server.json; the app appends "/api") and is the
# default for the updater endpoint (<serverBaseUrl>/api/version/latest, see :packaging). Override per
# build with -PserverBaseUrl=https://malenia.feld.cvut.cz/koubic.
serverBaseUrl=http://192.168.122.183:10001

# The updater endpoint written to <install_dir>/updater.properties by :packaging defaults to
# ${serverBaseUrl}/api/version/latest. To point it elsewhere, pass -PupdateEndpoint=<full url>.
